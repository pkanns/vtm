<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Mulai</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vtm_2.css">
  <script src="assets/vtm.js"></script>
  <script src="assets/vtm_auth_guard.js"></script>
  <style>
    /* ── COVER ─────────────────────────────────────────────────────────── */
    .cover { background: var(--charcoal); padding: 40px 48px; border-bottom: 4px solid var(--red); }
    .cover-welcome { font-family: var(--font-display); font-size: 2.4rem; letter-spacing: 0.02em; color: var(--white); line-height: 1.15; }
    .cover-email { font-size: 12px; font-family: var(--font-mono); color: rgba(240,234,216,0.4); letter-spacing: 0.02em; margin-top: 6px; }
    .cover-role-line { margin-top: 18px; font-size: 13px; font-family: var(--font-body); color: rgba(240,234,216,0.55); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .cover-role-pill { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 14px; font-weight: 600; font-family: var(--font-mono); }
    .cover-role-pill.role-admin { background: rgba(240,234,216,0.15); color: var(--white); }
    .cover-role-pill.role-pacer { background: var(--red); color: var(--white); }
    .cover-role-pill.role-rover { background: var(--green); color: var(--white); }

    .cover-rating { display: inline-flex; align-items: center; gap: 8px; margin-left: 4px; }
    .rating-stars { font-size: 15px; letter-spacing: 2px; }
    .rating-stars .star { color: rgba(240,234,216,0.2); }
    .rating-stars .star.filled { color: var(--red); }
    .rating-value { font-family: var(--font-mono); font-size: 11px; color: rgba(240,234,216,0.5); }

    /* ── BENTO GRID ────────────────────────────────────────────────────── */
    .page-container { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }

    .bento-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: minmax(220px, 1fr);
      gap: 3px;
      background: var(--black);
      min-height: 60vh;
    }
    .bento-block {
      background: var(--white);
      padding: 26px 30px;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
      overflow: hidden;
    }
    .bento-block:hover { background: var(--light); }
    .bento-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--stone); }
    .bento-headline {
      font-family: var(--font-display);
      font-size: 2.1rem;
      letter-spacing: 0.02em;
      color: var(--black);
      line-height: 1.05;
      margin: 12px 0 4px;
      display: flex;
      align-items: center;
    }
    .bento-sub { font-family: var(--font-body); font-size: 13px; color: var(--stone); }
    .bento-hint { font-family: var(--font-mono); font-size: 10px; color: var(--red); letter-spacing: 0.06em; margin-top: auto; padding-top: 14px; }

    .bento-status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--stone); display: inline-block; margin-right: 10px; flex-shrink: 0; }
    .bento-clock { border-left: 6px solid var(--stone); }
    .bento-clock.clocked-in  { border-left-color: var(--green); }
    .bento-clock.clocked-in .bento-status-dot { background: var(--green); animation: vtm-pulse 1.8s ease-in-out infinite; }
    .bento-clock.clocked-out { border-left-color: var(--red); }
    .bento-clock.clocked-out .bento-status-dot { background: var(--red); }
    @keyframes vtm-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }

    .bento-report { border-left: 6px solid var(--charcoal); }

    .bento-tasks { border-left: 6px solid var(--red); }
    .bento-task-list { margin-top: 8px; flex: 1; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
    .bento-task-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--light); font-size: 12.5px; }
    .bento-task-row:last-child { border-bottom: none; }
    .bento-task-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-body); color: var(--black); }
    .bento-task-title.done { color: var(--stone); text-decoration: line-through; }
    .bento-task-due { font-family: var(--font-mono); font-size: 10px; color: var(--stone); white-space: nowrap; }
    .bento-task-due.overdue { color: var(--red); font-weight: 700; }
    .bento-task-check { width: 14px; height: 14px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }

    .bento-fourth { border-left: 6px solid var(--green); }

    @media (max-width: 768px) {
      .bento-grid { grid-template-columns: 1fr; min-height: auto; }
      .bento-block { padding: 22px 24px; }
      .cover { padding: 32px 24px; }
      .cover-welcome { font-size: 1.9rem; }
    }
  </style>
</head>
<body data-page="home">

<!-- ── HEADER — deferred until the session is confirmed populated. See
     assets/dashboard.js: dashboard.html is the one page that might load
     before sessionStorage has data (fresh landing after login, an OAuth
     return, or a direct/refreshed visit), unlike every other page which
     assumes vtmGetSession() is already ready. ── -->
<div id="vtmHeader"></div>

<div class="cover">
  <div class="cover-welcome">Welcome to Mulai, <strong id="coverFirstName">…</strong></div>
  <div class="cover-email" id="coverEmail"></div>
  <div class="cover-role-line">
    You are logged in as a <span class="cover-role-pill" id="coverRolePill">…</span>
    <span class="cover-rating" id="coverRating" style="display:none">
      <span class="rating-stars" id="ratingStars"></span>
      <span class="rating-value" id="ratingValue"></span>
    </span>
  </div>
</div>

<div class="punch-strip" id="dashPunchStrip"></div>

<div class="page-container">
  <div class="bento-grid">

    <!-- BLOCK 1 — Clock -->
    <div class="bento-block bento-clock" id="blockClock" onclick="handleClockBlock()">
      <div class="bento-label">Time Register</div>
      <div class="bento-headline" id="clockHeadline"><span class="bento-status-dot"></span>—</div>
      <div class="bento-sub" id="clockSub">Checking…</div>
      <div class="bento-hint" id="clockHint"></div>
    </div>

    <!-- BLOCK 2 — Weekly Report -->
    <a class="bento-block bento-report" href="weekly_report.html">
      <div class="bento-label">Weekly Report</div>
      <div class="bento-headline">This Week</div>
      <div class="bento-sub" id="weekTotalText">Loading…</div>
      <div class="bento-hint">Open full report →</div>
    </a>

    <!-- BLOCK 3 — Gigs & Tasks -->
    <div class="bento-block bento-tasks" id="blockTasks" onclick="window.location.href='project_index.html'">
      <div class="bento-label">Gigs &amp; Tasks</div>
      <div class="bento-headline" id="taskCountHeadline">—</div>
      <div class="bento-task-list" id="bentoTaskList"><div class="tasks-empty">Loading…</div></div>
      <div class="bento-hint">View all gigs →</div>
    </div>

    <!-- BLOCK 4 — role-conditional -->
    <div class="bento-block bento-fourth" id="blockFourth">
      <div class="bento-label" id="fourthLabel">—</div>
      <div class="bento-headline" id="fourthHeadline">—</div>
      <div class="bento-sub" id="fourthSub"></div>
      <div class="bento-hint" id="fourthHint"></div>
    </div>

  </div>
</div>

<script type="module" src="assets/dashboard.js"></script>
</body>
</html>
