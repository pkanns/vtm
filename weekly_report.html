<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Report — Mulai</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vtm_2.css">
  <script src="assets/vtm.js"></script>
  <script src="assets/vtm_auth_guard.js"></script>
  <style>

    .page-wrap { max-width: 780px; margin: 0 auto; padding: 32px 24px 80px; }

    .data-view-banner {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--red); color: var(--white);
      padding: 12px 20px; margin-bottom: 20px; border-radius: 4px;
      text-decoration: none; transition: background 0.15s;
    }
    .data-view-banner:hover { background: var(--red-dark); }
    .data-view-banner-text { font-family: var(--font-body); font-size: 12px; letter-spacing: 0.04em; }
    .data-view-banner-arrow { font-family: var(--font-mono); font-size: 13px; }

    .report-card { border: 2px solid var(--black); background: var(--white); margin-bottom: 24px; }

    .report-header {
      background: var(--black); padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
    }
    .week-nav { display: flex; align-items: center; gap: 10px; }
    .week-nav-btn {
      background: none; border: none; color: rgba(240,234,216,0.4);
      font-size: 14px; cursor: pointer; padding: 2px 4px; line-height: 1;
      transition: color 0.15s;
    }
    .week-nav-btn:hover:not(:disabled) { color: var(--white); }
    .week-nav-btn:disabled { opacity: 0.2; cursor: default; }
    .week-label { font-family: var(--font-display); color: var(--white); font-size: 18px; letter-spacing: 0.03em; }

    .report-body { padding: 20px 24px 24px; }
    .section-label {
      font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--stone); margin-bottom: 10px;
    }

    /* ── VIEW TABS — Time / Task / Gig. Static, always visible; the
       panel below is empty until one is clicked, and collapses again on
       a second click of the same tab. Nothing here fetches data on its
       own — that's entirely driven by assets/weekly_report.js. ── */
    .view-tabs { display: flex; gap: 8px; margin-bottom: 4px; }
    .view-tab {
      background: var(--light); border: 1px solid var(--hole); border-radius: 20px;
      padding: 7px 18px; font-family: var(--font-body); font-size: 12px;
      color: var(--charcoal); cursor: pointer; transition: all 0.15s;
    }
    .view-tab:hover { border-color: var(--charcoal); }
    .view-tab.active { background: var(--black); color: var(--white); border-color: var(--black); }

    #viewPanel { margin-top: 14px; }
    #viewPanel:empty { margin-top: 0; }

    .bars-section { padding: 4px 0 20px; }
    .bar-row { display: grid; grid-template-columns: 110px 1fr 60px; align-items: center; gap: 10px; margin-bottom: 8px; }
    .bar-track { background: var(--light); border-radius: 3px; height: 14px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; }
    .bar-row-value { font-family: var(--font-mono); font-size: 11px; color: var(--charcoal); text-align: right; }
    .bars-empty { text-align: center; color: var(--stone); font-size: 12px; padding: 12px 0; }

    .gigs-list { border-top: 2px solid var(--black); margin-bottom: 8px; }
    .gig-row {
      display: grid; grid-template-columns: 1fr auto auto auto; gap: 14px;
      align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--light);
    }
    .gig-row-title { font-size: 13px; color: var(--black); }
    .gig-row-code { font-family: var(--font-mono); font-size: 10px; color: var(--red); font-weight: 600; }
    .gig-row-due { font-size: 11px; color: var(--stone); }
    .gig-row-due.overdue { color: var(--red); font-weight: 700; }
    .gig-row-hours { font-family: var(--font-body); font-weight: 700; font-size: 12px; color: var(--black); }
    .task-title-done { color: var(--stone); text-decoration: line-through; }
    .task-check { width: 16px; height: 16px; accent-color: var(--green); cursor: pointer; justify-self: end; }
    .task-check:disabled { cursor: not-allowed; opacity: 0.5; }

    .status-pill { display: inline-block; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; font-weight: 600; }
    .status-pill.placed      { background: #e8eef5; color: #2a5a8a; }
    .status-pill.matched     { background: #f5eef8; color: #7b3fa0; }
    .status-pill.aligned     { background: #fdf5e0; color: #8a6200; }
    .status-pill.in_progress { background: #fceee8; color: var(--red); }
    .status-pill.delivered   { background: #e8f5ee; color: var(--green); }
    .status-pill.completed   { background: var(--light); color: var(--stone); }

    .closed-line { font-family: var(--font-mono); font-size: 10px; color: var(--stone); margin-top: 8px; }
    .closed-line strong { color: var(--black); font-weight: 600; }

    .text-block { margin-top: 20px; }
    .text-block-card {
      background: var(--white); border: 1px solid #d8d0ba; border-radius: 10px;
      padding: 14px 16px; margin-bottom: 10px;
    }
    .text-block-card label {
      display: block; font-family: var(--font-mono); font-size: 9px;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); margin-bottom: 6px;
    }
    .text-block-card textarea {
      width: 100%; border: none; background: transparent; resize: vertical;
      min-height: 54px; font-family: var(--font-body); font-size: 13px;
      color: var(--black); outline: none; line-height: 1.5;
    }
    .text-block-card textarea::placeholder { color: #bbb; font-style: italic; }

    .text-readonly { background: var(--light); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .text-readonly label {
      display: block; font-family: var(--font-mono); font-size: 9px;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); margin-bottom: 6px;
    }

    .history-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .history-label { font-family: var(--font-display); font-size: 15px; color: var(--black); }
    .history-nav-btn {
      background: none; border: 1px solid var(--hole); color: var(--charcoal);
      font-size: 14px; cursor: pointer; padding: 3px 9px; line-height: 1;
      border-radius: 20px; transition: all 0.15s;
    }
    .history-nav-btn:hover:not(:disabled) { border-color: var(--charcoal); color: var(--black); }
    .history-nav-btn:disabled { opacity: 0.3; cursor: default; }

    .report-actions { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 16px; }
    .save-note { font-family: var(--font-mono); font-size: 10px; color: var(--stone); }
    .btn-save {
      background: var(--red); color: var(--white); border: none;
      padding: 9px 20px; font-family: var(--font-body); font-size: 11px;
      letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: background 0.2s;
    }
    .btn-save:hover { background: var(--red-dark); }

    .empty-week { text-align: center; padding: 32px 0; color: var(--stone); font-size: 13px; }

    @media (max-width: 640px) {
      .gig-row { grid-template-columns: 1fr; gap: 4px; padding-bottom: 14px; }
      .bar-row { grid-template-columns: 90px 1fr 50px; }
      .view-tabs { flex-wrap: wrap; }
    }
  </style>
</head>
<body data-page="weekly">

<div id="vtmHeader"></div>
<script src="assets/vtm_header.js"></script>

<div class="page-wrap">

  <a href="report_dashboard.html" class="data-view-banner">
    <span class="data-view-banner-text">Data View &mdash; browse and filter across weeks, gigs, effort, and people</span>
    <span class="data-view-banner-arrow">&rarr;</span>
  </a>

  <div class="report-card">
    <div class="report-header">
      <div class="week-label" id="weekLabel">Week of &mdash;</div>
    </div>
    <div class="report-body">
      <div class="view-tabs" id="viewTabs">
        <button class="view-tab" data-view="time" onclick="setView('time')">Time View</button>
        <button class="view-tab" data-view="task" onclick="setView('task')">Task View</button>
        <button class="view-tab" data-view="gig"  onclick="setView('gig')">Gig View</button>
        <button class="view-tab" data-view="lastweek" onclick="setView('lastweek')">Last Week</button>
        <button class="view-tab" data-view="history"  onclick="setView('history')">History</button>
      </div>
      <div id="reportBody">
        <div class="empty-week">Loading&hellip;</div>
      </div>
    </div>
  </div>

</div>

<script type="module" src="assets/weekly_report.js"></script>
</body>
</html>
