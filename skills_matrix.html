<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills — Mulai</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vtm_2.css">
  <script src="assets/vtm.js"></script>
  <script src="assets/vtm_auth_guard.js"></script>
  <style>
    /* Page-specific styles only. Colours, type and the header come from
       assets/vtm_2.css and assets/vtm_header.js. Every class here is prefixed
       sk- so nothing can collide with the shared stylesheet. */

    :where(.sk-wrap) *, :where(.sk-wrap) *::before, :where(.sk-wrap) *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :where(.sk-wrap) :is(button, input, select) { font: inherit; color: inherit; }
    .sk-wrap :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

    .sk-wrap { max-width: 1200px; margin: 0 auto; padding: 28px 24px 80px; }
    .sk-top { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
    .sk-title { font: 400 2.1rem var(--font-display); letter-spacing: .02em; line-height: 1; }
    .sk-sub { font: 400 11px var(--font-mono); color: var(--stone); letter-spacing: .04em; margin-top: 6px; }
    .sk-tabs { display: flex; border: 2px solid var(--black); }
    .sk-tabs button { border: 0; background: var(--white); padding: 9px 20px; font: 500 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--stone); cursor: pointer; border-right: 1px solid var(--hole); }
    .sk-tabs button:last-child { border-right: 0; }
    .sk-tabs button[aria-selected=true] { background: var(--black); color: var(--white); }

    .sk-msg { padding: 48px 0; text-align: center; color: var(--stone); font-size: 13px; }
    .sk-msg.err { color: var(--red); }

    .sk-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    .sk-bar label { font: 400 9px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--stone); }
    .sk-sel, .sk-chip, .sk-btn { background: var(--white); border: 1px solid var(--hole); border-radius: 20px; padding: 6px 14px; font: 400 12px var(--font-body); cursor: pointer; }
    .sk-sel { padding-right: 8px; }
    .sk-chip[aria-pressed=true], .sk-btn.sk-pri { background: var(--black); color: var(--white); border-color: var(--black); }
    .sk-btn.sk-red { background: var(--red); color: var(--white); border-color: var(--red); }
    .sk-sp { flex: 1; }

    /* Profile card — the shell is the shared .punch-card / .entry-card-header */
    .sk-prof { margin-bottom: 14px; }
    .sk-prof-b { display: grid; grid-template-columns: minmax(220px, 1fr) 2fr; gap: 20px; padding: 14px 16px; }
    .sk-prof-b label { display: block; font: 400 9px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--stone); margin-bottom: 6px; }
    .sk-prof-b .sk-sel { width: 100%; }
    .sk-prof-d { font-size: 12px; color: var(--charcoal); margin-top: 8px; line-height: 1.5; }
    .sk-str { display: flex; flex-wrap: wrap; gap: 8px; }
    .sk-slot { display: flex; flex-direction: column; gap: 4px; min-width: 130px; flex: 1; }
    .sk-slot b { font: 500 10px var(--font-mono); color: var(--red); }
    .sk-slot small { font: 400 9px var(--font-mono); color: var(--stone); letter-spacing: .06em; }

    /* My skills */
    .sk-split { display: grid; grid-template-columns: 290px 1fr; border: 2px solid var(--black); background: var(--white); min-height: 480px; }
    .sk-rail { background: var(--light); border-right: 2px solid var(--black); padding: 8px 0; }
    .sk-rfh, .sk-rt { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; text-align: left; cursor: pointer; padding: 9px 16px; }
    .sk-rfh { font: 400 1.1rem var(--font-display); letter-spacing: .04em; border-top: 1px solid var(--hole); }
    .sk-rf:first-child .sk-rfh { border-top: 0; }
    .sk-rt { padding: 6px 16px 6px 36px; font-size: 13px; color: var(--charcoal); border-left: 4px solid transparent; }
    .sk-rt:hover { background: var(--white); }
    .sk-rt.sk-on { background: var(--white); border-left-color: var(--red); font-weight: 700; }
    .sk-rfh small, .sk-rt small { margin-left: auto; font: 400 10px var(--font-mono); color: var(--stone); }
    .sk-car { font-size: 10px; color: var(--stone); width: 10px; }
    .sk-pane { padding: 24px 30px; }
    .sk-crumb { font: 400 10px var(--font-mono); color: var(--stone); letter-spacing: .06em; }
    .sk-pane h2 { font: 400 1.8rem var(--font-display); letter-spacing: .02em; line-height: 1.1; margin: 4px 0 10px; }
    .sk-prog { height: 6px; background: var(--light); border: 1px solid var(--hole); max-width: 320px; margin-bottom: 6px; }
    .sk-prog b { display: block; height: 100%; background: var(--green); }
    .sk-srow { display: grid; grid-template-columns: 1fr auto 96px; gap: 18px; align-items: center; padding: 14px 0; border-top: 1px solid var(--light); }
    .sk-srow:first-of-type { border-top: 2px solid var(--black); margin-top: 16px; }
    .sk-sname { font-size: 14px; }
    .sk-lv { display: flex; gap: 4px; }
    .sk-lv button { width: 38px; height: 38px; border: 1px solid var(--hole); background: var(--white); cursor: pointer; display: grid; place-items: center; border-radius: 4px; transition: background .12s; }
    .sk-lv button:hover { background: var(--light); }
    .sk-lv button.sk-on { border: 2px solid var(--black); background: var(--light); }
    .sk-lvn { font: 500 11px var(--font-mono); color: var(--stone); }
    .sk-lvn.sk-on { color: var(--red); font-weight: 700; }
    .sk-legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font: 400 11px var(--font-mono); color: var(--stone); margin-bottom: 14px; }
    .sk-legend span { display: flex; gap: 7px; align-items: center; }

    /* Team matrix */
    .sk-mwrap { border: 2px solid var(--black); background: var(--white); overflow: auto; max-height: 70vh; }
    .sk-mwrap table { border-collapse: separate; border-spacing: 0; width: 100%; }
    .sk-mwrap th { position: sticky; top: 0; z-index: 3; background: var(--black); color: var(--white); padding: 10px 14px; text-align: center; font: 400 1rem var(--font-display); letter-spacing: .05em; }
    .sk-mwrap th small { display: block; font: 400 9px var(--font-mono); color: rgba(240,234,216,.5); letter-spacing: .08em; }
    .sk-mwrap th.sk-f, .sk-mwrap td.sk-f { text-align: left; position: sticky; left: 0; min-width: 340px; z-index: 2; }
    .sk-mwrap th.sk-f { z-index: 4; }
    .sk-mwrap td { padding: 8px 14px; border-bottom: 1px solid var(--light); text-align: center; background: var(--white); }
    .sk-mwrap td.sk-f { background: var(--white); }
    .sk-mwrap tr.sk-trfn td { background: var(--charcoal); color: var(--white); font: 400 1.05rem var(--font-display); letter-spacing: .06em; text-align: left; border-bottom: 0; padding: 7px 14px; }
    .sk-mwrap tr.sk-trth td { background: var(--light); cursor: pointer; font-weight: 700; font-size: 13px; }
    .sk-mwrap tr.sk-trth td.sk-f { background: var(--light); }
    .sk-mwrap tr.sk-trth:hover td { background: var(--hole); }
    .sk-mwrap tr.sk-trsk td.sk-f { padding-left: 40px; font-size: 13px; color: var(--charcoal); }
    .sk-cov { font: 400 10px var(--font-mono); color: var(--stone); white-space: nowrap; }
    .sk-gapdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-left: 8px; }
    .sk-gapn { font: 600 9px var(--font-mono); background: var(--red); color: var(--white); padding: 1px 7px; margin-left: 8px; }

    /* Library */
    .sk-lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
    .sk-lcard { background: var(--white); border: 2px solid var(--black); border-top: 4px solid var(--red); }
    .sk-lcard h3 { padding: 10px 14px; background: var(--black); }
    .sk-lcard h3 input { background: none; border: 0; color: var(--white); font: 400 1.2rem var(--font-display); letter-spacing: .05em; width: 100%; }
    .sk-lth { padding: 10px 14px 6px; border-bottom: 1px solid var(--light); }
    .sk-lth input.sk-tn { font-weight: 700; border: 0; background: none; width: 100%; font-size: 13px; border-bottom: 1px dashed var(--hole); }
    .sk-lsk { display: flex; gap: 6px; align-items: center; padding: 2px 0 2px 14px; }
    .sk-lsk input { flex: 1; border: 0; background: none; font-size: 12.5px; padding: 3px 0; min-width: 0; }
    .sk-lsk.sk-off input { text-decoration: line-through; color: var(--stone); }
    .sk-x { background: none; border: 1px solid var(--hole); color: var(--stone); font: 400 10px var(--font-mono); padding: 1px 7px; cursor: pointer; }
    .sk-x:hover { border-color: var(--red); color: var(--red); }
    .sk-add { background: none; border: 0; color: var(--red); font: 500 11px var(--font-mono); cursor: pointer; padding: 6px 14px; }

    @media (max-width: 820px) {
      .sk-split { grid-template-columns: 1fr; }
      .sk-rail { border-right: 0; border-bottom: 2px solid var(--black); }
      .sk-srow { grid-template-columns: 1fr; gap: 8px; }
      .sk-wrap { padding: 20px 16px 80px; }
      .sk-pane { padding: 20px 16px; }
      .sk-prof-b { grid-template-columns: 1fr; }
      .sk-mwrap th.sk-f, .sk-mwrap td.sk-f { min-width: 210px; }
    }
  </style>
</head>
<body data-page="skills">

<!-- ── HEADER — injected by assets/vtm_header.js ─────────────────────────── -->
<div id="vtmHeader"></div>
<script src="assets/vtm_header.js"></script>

<div class="punch-strip" id="topPunchStrip"></div>

<div class="sk-wrap">
  <div class="sk-top">
    <div>
      <h1 class="sk-title">Skills</h1>
      <div class="sk-sub" id="skSub">Loading…</div>
    </div>
    <div class="sk-tabs" id="skTabs" role="tablist"></div>
  </div>
  <div id="skApp"><div class="sk-msg">Loading…</div></div>
</div>

<script type="module" src="assets/skills_matrix.js"></script>
</body>
</html>
