<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Mulai</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vtm_2.css">
  <script src="assets/vtm.js"></script>
  <script src="assets/vtm_auth_guard.js"></script>
  <style>
    .cover { background: var(--charcoal); padding: 40px 48px; border-bottom: 4px solid var(--red); }
    .cover-welcome { font-family: var(--font-display); font-size: 2.4rem; letter-spacing: 0.02em; color: var(--white); line-height: 1.15; }
    .cover-email { font-size: 12px; font-family: var(--font-mono); color: rgba(240,234,216,0.4); letter-spacing: 0.02em; margin-top: 6px; }
    .cover-role-line { margin-top: 18px; font-size: 13px; font-family: var(--font-body); color: rgba(240,234,216,0.55); display: flex; align-items: center; gap: 10px; }
    .cover-role-pill { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 14px; font-weight: 600; font-family: var(--font-mono); }
    .cover-role-pill.role-admin { background: rgba(240,234,216,0.15); color: var(--white); }
    .cover-role-pill.role-pacer { background: var(--red); color: var(--white); }
    .cover-role-pill.role-rover { background: var(--green); color: var(--white); }

    .page-container { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
    .picker-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--stone); margin-bottom: 16px; }
    .picker-empty { background: var(--white); padding: 40px; text-align: center; color: var(--stone); font-size: 13px; border-top: 4px solid var(--charcoal); }

    @media (max-width: 640px) {
      .cover { padding: 32px 24px; }
      .cover-welcome { font-size: 1.9rem; }
    }
  </style>
</head>
<body data-page="home">

<!-- ── HEADER — deferred until the session is confirmed populated. See
     assets/dashboard.js: dashboard.html is the one page that might load
     before sessionStorage has data (fresh landing after login, an OAuth
     return, or a direct/refreshed visit), unlike every other page which
     assumes vtmGetSession() is already ready. ── -->
<div id="vtmHeader"></div>

<div class="cover">
  <div class="cover-welcome">Welcome to Mulai, <strong id="coverFirstName">…</strong></div>
  <div class="cover-email" id="coverEmail"></div>
  <div class="cover-role-line">
    You are logged in as a <span class="cover-role-pill" id="coverRolePill">…</span>
  </div>
</div>

<div class="page-container">
  <div class="picker-label">Your Workspace</div>
  <div class="vtm-picker-grid" id="pagesGrid"></div>
  <div class="picker-empty" id="pagesEmpty" style="display:none;"></div>
</div>

<script type="module" src="assets/dashboard.js"></script>
</body>
</html>
