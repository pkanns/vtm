<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gig Evaluation — Mulai</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="assets/vtm_2.css">
  <script src="assets/vtm.js"></script>
  <script src="assets/vtm_auth_guard.js"></script>
  <style>
    .eval-container { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }

    .picker-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--stone); margin-bottom: 14px; }
    .picker-empty { background: var(--white); padding: 40px; text-align: center; color: var(--stone); font-size: 13px; border-top: 4px solid var(--charcoal); }

    /* ── LOADED GIG ─────────────────────────────────────────────────────── */
    #loadedSection { display: none; margin-top: 8px; }
    .change-gig-bar { display: flex; align-items: center; justify-content: space-between; background: var(--green); padding: 10px 20px; margin-bottom: 20px; }
    .change-gig-label { font-family: var(--font-mono); font-size: 11px; color: var(--white); letter-spacing: 0.04em; }
    .change-gig-btn { background: none; border: 1px solid rgba(240,234,216,0.4); color: rgba(240,234,216,0.8); padding: 5px 14px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; font-family: var(--font-body); }
    .change-gig-btn:hover { border-color: var(--white); color: var(--white); }

    .meta-strip { background: var(--black); display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 4px; }
    .meta-cell { padding: 12px 18px; border-right: 1px solid rgba(240,234,216,0.1); }
    .meta-cell:last-child { border-right: none; }
    .meta-cell-label { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(240,234,216,0.35); margin-bottom: 4px; }
    .meta-cell-val { font-family: var(--font-typed, 'Special Elite'), cursive; font-size: 13px; color: var(--white); }

    .reflection-row { display: flex; align-items: center; gap: 14px; background: var(--white); padding: 14px 18px; margin-bottom: 20px; border-left: 3px solid var(--green); flex-wrap: wrap; }
    .reflection-row label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); font-weight: 500; font-family: var(--font-mono); }
    .reflection-row input[type="date"] { padding: 7px 10px; background: var(--light); border: none; border-bottom: 1px solid var(--hole); font-family: var(--font-body); font-size: 13px; outline: none; }

    /* ── RATINGS TABLE ─────────────────────────────────────────────────── */
    .eval-table { width: 100%; border-collapse: collapse; background: var(--white); margin-bottom: 20px; }
    .eval-table thead tr { background: var(--black); color: var(--white); }
    .eval-table th { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; padding: 10px 14px; text-align: left; font-family: var(--font-mono); }
    .eval-table th.center { text-align: center; }
    .eval-table td { padding: 14px; border-bottom: 1px solid var(--light); vertical-align: middle; }
    .eval-table td.center { text-align: center; }

    .attr-name { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: 0.02em; color: var(--black); }
    .attr-desc { font-size: 11.5px; color: var(--stone); margin-top: 2px; }
    .attr-details-toggle { background: none; border: 1px solid var(--hole); color: var(--stone); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; cursor: pointer; margin-top: 8px; transition: all 0.15s; }
    .attr-details-toggle:hover { border-color: var(--red); color: var(--red); }
    .attr-details-toggle.open { border-color: var(--charcoal); color: var(--charcoal); background: var(--light); }

    .details-row td { padding: 0; border-bottom: 1px solid var(--light); }
    .details-panel { background: var(--light); border-left: 3px solid var(--red); padding: 14px 18px; margin: 2px 10px 10px; font-size: 12.5px; }
    .details-row-line { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dotted var(--hole); }
    .details-row-line:last-child { border-bottom: none; }
    .details-row-line .k { color: var(--stone); font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.04em; }
    .details-row-line .v { color: var(--black); font-weight: 700; }
    .details-row-line .v.warn { color: var(--red); }
    .details-list { margin-top: 8px; font-size: 12px; color: var(--charcoal); }
    .details-list div { padding: 2px 0; }
    .details-note { font-family: var(--font-mono); font-size: 10px; color: var(--stone); margin-top: 8px; font-style: italic; }

    /* ── STAR + SLIDER — width-locked so the slider spans exactly the
       star row's width ── */
    .star-rating-widget { width: 116px; margin: 0 auto; }
    .star-rating-widget .stars { display: flex; flex-direction: row-reverse; justify-content: space-between; width: 100%; }
    .star-rating-widget .stars input { display: none; }
    .star-rating-widget .stars label { font-size: 19px; color: var(--hole); cursor: pointer; transition: color 0.15s; line-height: 1; }
    .star-rating-widget .stars label:hover,
    .star-rating-widget .stars label:hover ~ label,
    .star-rating-widget .stars input:checked ~ label { color: var(--red); }
    .star-rating-widget .star-slider { width: 100%; margin-top: 6px; -webkit-appearance: none; appearance: none; height: 4px; background: var(--hole); border-radius: 2px; outline: none; cursor: pointer; display: block; }
    .star-rating-widget .star-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--red); cursor: pointer; border: 2px solid var(--white); }
    .star-rating-widget .star-slider::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--red); border: 2px solid var(--white); cursor: pointer; }
    .star-rating-widget.disabled { opacity: 0.45; pointer-events: none; }

    .score-cell { font-family: var(--font-display); font-size: 1.5rem; color: var(--red); }

    /* ── NOTES (now above Final Score) ─────────────────────────────────── */
    .notes-block { background: var(--white); border-top: 4px solid var(--charcoal); padding: 20px 24px; margin-bottom: 20px; }
    .notes-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone); margin-bottom: 8px; }
    .notes-input { width: 100%; background: var(--light); border: none; border-bottom: 1px solid var(--hole); padding: 10px 12px; font-family: var(--font-body); font-size: 13px; min-height: 70px; outline: none; resize: vertical; }
    .notes-input:focus { border-bottom-color: var(--red); }

    /* ── FINAL SCORE ────────────────────────────────────────────────────── */
    .final-block { background: var(--black); padding: 26px 32px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .final-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(240,234,216,0.4); }
    .final-sub { font-size: 11px; color: rgba(240,234,216,0.3); font-family: var(--font-mono); margin-top: 4px; }
    .final-value { font-family: var(--font-display); font-size: 2.4rem; color: var(--white); display: flex; align-items: center; }
    .final-value .star-glyphs { color: var(--red); letter-spacing: 2px; font-size: 1.5rem; margin-left: 12px; }

    .submit-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .submit-note { font-size: 12px; color: var(--stone); }
    .btn-submit { background: var(--red); color: var(--white); border: none; padding: 13px 32px; font-family: var(--font-body); font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background 0.2s, transform 0.15s; }
    .btn-submit:hover { background: var(--red-dark); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  </style>
</head>
<body data-page="evaluate">

<!-- ── HEADER — injected by assets/vtm_header.js ─────────────────────────── -->
<div id="vtmHeader"></div>
<script src="assets/vtm_header.js"></script>

<main class="eval-container">

  <!-- GIG PICKER -->
  <div id="pickerSection">
    <div class="picker-label" id="pickerLabel">Ready for Reflection — select a gig</div>
    <div class="vtm-picker-grid" id="gigPickerGrid"></div>
    <div class="picker-empty" id="pickerEmpty" style="display:none;"></div>
  </div>

  <!-- LOADED GIG -->
  <div id="loadedSection">
    <div class="change-gig-bar">
      <span class="change-gig-label" id="loadedGigLabel"></span>
      <button class="change-gig-btn" onclick="resetPicker()">Change Gig</button>
    </div>

    <div class="meta-strip">
      <div class="meta-cell"><div class="meta-cell-label">Gig</div><div class="meta-cell-val" id="metaGigCode">—</div></div>
      <div class="meta-cell"><div class="meta-cell-label">Doer</div><div class="meta-cell-val" id="metaRover">—</div></div>
      <div class="meta-cell"><div class="meta-cell-label">Lead</div><div class="meta-cell-val" id="metaPacer">—</div></div>
      <div class="meta-cell"><div class="meta-cell-label">Setting</div><div class="meta-cell-val" id="metaSetting">—</div></div>
    </div>

    <div class="reflection-row">
      <label>Reflection Date</label>
      <input type="date" id="reflectionDate">
      <span style="color:var(--stone);font-size:11.5px;">Both parties should be present for this discussion.</span>
    </div>

    <table class="eval-table">
      <thead>
        <tr>
          <th style="width:38%">Attribute</th>
          <th class="center" style="width:20%">Doer Rating</th>
          <th class="center" style="width:20%">Lead Rating</th>
          <th class="center" style="width:12%">Score</th>
        </tr>
      </thead>
      <tbody id="ratingsBody"></tbody>
    </table>

    <div class="notes-block">
      <div class="notes-label">Discussion Notes</div>
      <textarea class="notes-input" id="notes" placeholder="Key points from the discussion session…"></textarea>
    </div>

    <div class="final-block">
      <div>
        <div class="final-label">Final Score</div>
        <div class="final-sub" id="finalSub">Average of Lead ratings</div>
      </div>
      <div class="final-value"><span id="finalNum">—</span><span class="star-glyphs" id="finalStars"></span></div>
    </div>

    <div class="submit-row">
      <p class="submit-note" id="submitNote">Evaluation saved to database.</p>
      <button class="btn-submit" id="submitRoverBtn" style="display:none;background:var(--green);" onclick="submitRoverEval()">Save Self-Rating →</button>
      <button class="btn-submit" id="submitPacerBtn" style="display:none;" onclick="submitPacerEval()">Save Evaluation →</button>
      <button class="btn-submit" id="submitBtn" style="display:none;" onclick="submitEval()">Save Evaluation →</button>
    </div>
  </div>

</main>

<script type="module" src="assets/gig_eval.js"></script>
</body>
</html>
